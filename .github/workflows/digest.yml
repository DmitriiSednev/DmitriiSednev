name: AI Digest

on:
  schedule:
    - cron: "7 * * * *"   # каждый час
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update digest
        run: python .github/scripts/update_digest.py

      - name: Commit if changed
        run: |
          # коммитим от имени бота: эти коммиты не попадают в contribution graph
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: refresh AI digest"
            git push
          else
            echo "No changes"
          fi
